name: e2e test
on:
  # Trigger the workflow on push or pull request,
  # but only for the master branch
  push:
    paths-ignore:
      - '**.md'
      - '**.png'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.png'
jobs:
  job_1:
    name: Build goc binary
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.19'
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Go build
        run: |
          go build
      - name: Use goc to build self
        run: |
          ./goc build --output ./gocc --debug
      - name: Upload goc binary
        uses: actions/upload-artifact@v4
        with:
          name: goc
          path: goc
      - name: Upload covered self goc binary
        uses: actions/upload-artifact@v4
        with:
          name: gocc
          path: gocc

  job_2:
    name: E2E test
    needs: job_1
    strategy:
      matrix:
        go-version: [1.16.x, 1.17.x, 1.18.x, 1.19.x]
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Download built binary
        uses: actions/download-artifact@v4
        with:
          path: /home/runner/tools
      - name: Install bats-core
        run: |
          git clone https://github.com/bats-core/bats-core.git
          cd bats-core
          sudo ./install.sh /usr/local
          bats --version
      - name: Do test
        env:
          GOVERSION: ${{ matrix.go-version }}
        run: |
          # 检查下载的文件是否存在
          echo "Checking downloaded artifacts..."
          ls -la /home/runner/tools/ || true
          find /home/runner/tools -name "goc*" -type f || true
          
          # 设置可执行权限并添加到PATH
          if [ -f "/home/runner/tools/goc/goc" ]; then
            chmod +x /home/runner/tools/goc/goc
            export PATH="/home/runner/tools/goc:$PATH"
            echo "goc binary found and added to PATH"
            goc version || true
          else
            echo "Error: goc binary not found at /home/runner/tools/goc/goc"
            find /home/runner/tools -type f -name "goc" -exec chmod +x {} \;
            GOC_PATH=$(find /home/runner/tools -type f -name "goc" | head -1)
            if [ -n "$GOC_PATH" ]; then
              export PATH="$(dirname $GOC_PATH):$PATH"
              echo "goc binary found at: $GOC_PATH"
            else
              echo "Error: goc binary not found anywhere"
              exit 1
            fi
          fi
          
          if [ -f "/home/runner/tools/gocc/gocc" ]; then
            chmod +x /home/runner/tools/gocc/gocc
            export PATH="/home/runner/tools/gocc:$PATH"
            echo "gocc binary found and added to PATH"
          else
            echo "Warning: gocc binary not found at /home/runner/tools/gocc/gocc"
            find /home/runner/tools -type f -name "gocc" -exec chmod +x {} \;
            GOCC_PATH=$(find /home/runner/tools -type f -name "gocc" | head -1)
            if [ -n "$GOCC_PATH" ]; then
              export PATH="$(dirname $GOCC_PATH):$PATH"
              echo "gocc binary found at: $GOCC_PATH"
            else
              echo "Warning: gocc binary not found, continuing without it"
            fi
          fi
          
          # 检查bats是否可用
          if ! command -v bats &> /dev/null; then
            echo "Error: bats command not found"
            exit 1
          fi
          
          # 运行测试
          cd tests
          chmod +x run-ci-actions.sh
          ./run-ci-actions.sh
